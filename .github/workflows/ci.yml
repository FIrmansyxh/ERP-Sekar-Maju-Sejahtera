name: CI

# Pemeriksaan otomatis untuk setiap perubahan sebelum digabung ke main:
# tipe (tsc strict), tes otomatis, dan build produksi. Tidak melakukan deploy.
on:
  pull_request:
  push:
    branches-ignore: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  periksa:
    name: Tipe, Tes, dan Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install Dependencies (sesuai package-lock.json)
      run: npm ci

    - name: Pemeriksaan Tipe
      run: npm run lint

    - name: Tes Otomatis
      run: npm test

    - name: Build Produksi
      run: npm run build
