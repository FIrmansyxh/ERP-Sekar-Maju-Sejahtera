name: Auto Deploy Frontend to VPS

on:
  push:
    branches:
      - main
      - staging

# Cegah build ganda bertumpuk jika ada beberapa push berurutan
concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Deploy ke STAGING (branch: staging)
  # ============================================================
  deploy-staging:
    name: Build & Deploy Frontend → Staging
    runs-on: ubuntu-latest
    if: github.ref_name == 'staging'
    environment: staging

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 3. Install Dependencies
      run: npm install

    - name: 4. Build Vite (Staging)
      run: npm run build
      env:
        VITE_API_URL: ${{ secrets.STAGING_VITE_API_URL }}

    - name: 5. Kompres Hasil Build dist
      run: tar -czf dist.tar.gz dist/

    - name: 6. Kirim dist.tar.gz ke Staging VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.STAGING_VPS_HOST }}
        username: ${{ secrets.STAGING_VPS_USER }}
        key: ${{ secrets.STAGING_VPS_SSH_KEY }}
        port: ${{ secrets.STAGING_VPS_PORT || 22 }}
        source: "dist.tar.gz"
        target: "/var/www/erp-fe/ERP-Sekar-Maju-Sejahtera"
        overwrite: true

    - name: 7. Ekstrak di Staging VPS & Reload Nginx
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.STAGING_VPS_HOST }}
        username: ${{ secrets.STAGING_VPS_USER }}
        key: ${{ secrets.STAGING_VPS_SSH_KEY }}
        port: ${{ secrets.STAGING_VPS_PORT || 22 }}
        command_timeout: 5m
        script: |
          echo "=== 1. Bersihkan sisa proses build lama ==="
          pkill -f "vite" || true
          pkill -f "tsc" || true

          echo "=== 2. Masuk ke folder frontend staging ==="
          cd /var/www/erp-fe/ERP-Sekar-Maju-Sejahtera
          git pull origin staging || true

          echo "=== 3. Ekstrak aset terbaru ==="
          tar -xzf dist.tar.gz
          rm -f dist.tar.gz

          echo "=== 4. Reload Nginx ==="
          sudo systemctl reload nginx

          echo "=== DEPLOY FRONTEND STAGING SUKSES! ==="

  # ============================================================
  # JOB 2: Deploy ke PRODUCTION (branch: main)
  # ============================================================
  deploy-production:
    name: Build & Deploy Frontend → Production
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    environment: production

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 3. Install Dependencies
      run: npm install

    - name: 4. Build Vite (Production)
      run: npm run build
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}

    - name: 5. Kompres Hasil Build dist
      run: tar -czf dist.tar.gz dist/

    - name: 6. Kirim dist.tar.gz ke Production VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        source: "dist.tar.gz"
        target: "/var/www/erp-fe/ERP-Sekar-Maju-Sejahtera"
        overwrite: true

    - name: 7. Ekstrak di Production VPS & Reload Nginx
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        command_timeout: 5m
        script: |
          echo "=== 1. Bersihkan sisa proses build lama ==="
          pkill -f "vite" || true
          pkill -f "tsc" || true

          echo "=== 2. Masuk ke folder frontend & sinkronkan Git ==="
          cd /var/www/erp-fe/ERP-Sekar-Maju-Sejahtera
          git pull origin main || true

          echo "=== 3. Ekstrak aset produksi terbaru ==="
          tar -xzf dist.tar.gz
          rm -f dist.tar.gz

          echo "=== 4. Reload Nginx ==="
          sudo systemctl reload nginx

          echo "=== DEPLOY FRONTEND PRODUCTION SUKSES! ==="
