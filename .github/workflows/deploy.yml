name: Auto Deploy Frontend to VPS

# Build, tes, dan kompres dilakukan di GitHub Actions; VPS hanya menerima hasil build (dist/).
# Alamat API tidak perlu diatur saat build: aplikasi memakai {origin}/api/v1 dari domain yang dibuka.
# Bila frontend dan API berbeda domain, tambahkan env VITE_API_BASE_URL (lengkap dengan /api/v1) pada langkah build.
on:
  workflow_dispatch: # Auto-deploy dinonaktifkan sementara
  # push:
  #   branches:
  #     - main
  #     - staging

# Cegah build ganda bertumpuk jika ada beberapa push berurutan
concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Deploy ke STAGING (branch: staging)
  # ============================================================
  deploy-staging:
    name: Build & Deploy Frontend → Staging
    runs-on: ubuntu-latest
    if: github.ref_name == 'staging'
    environment: staging

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: 3. Install Dependencies (sesuai package-lock.json)
      run: npm ci

    - name: 4. Tes Otomatis (deploy dibatalkan bila ada yang gagal)
      run: npm test

    - name: 5. Build Vite (Staging)
      run: npm run build

    - name: 6. Kompres Hasil Build dist
      run: tar -czf dist.tar.gz dist/

    - name: 7. Kirim dist.tar.gz ke Staging VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.STAGING_VPS_HOST }}
        username: ${{ secrets.STAGING_VPS_USER }}
        key: ${{ secrets.STAGING_VPS_SSH_KEY }}
        port: ${{ secrets.STAGING_VPS_PORT || 22 }}
        source: "dist.tar.gz"
        target: "/var/www/erp-fe/ERP-Sekar-Maju-Sejahtera"
        overwrite: true

    - name: 8. Ekstrak di Staging VPS & Reload Nginx
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.STAGING_VPS_HOST }}
        username: ${{ secrets.STAGING_VPS_USER }}
        key: ${{ secrets.STAGING_VPS_SSH_KEY }}
        port: ${{ secrets.STAGING_VPS_PORT || 22 }}
        command_timeout: 5m
        script: |
          set -e
          cd /var/www/erp-fe/ERP-Sekar-Maju-Sejahtera
          # Berkas lama sengaja tidak dihapus: tab yang masih membuka versi sebelumnya tetap bisa memuat potongan kodenya
          tar -xzf dist.tar.gz
          rm -f dist.tar.gz
          sudo systemctl reload nginx
          echo "=== DEPLOY FRONTEND STAGING SUKSES ==="

  # ============================================================
  # JOB 2: Deploy ke PRODUCTION (branch: main)
  # Catatan: Deploy ke STAGING dilakukan manual lewat script
  #          deploy-staging.ps1 dari laptop lokal
  # ============================================================
  deploy-production:
    name: Build & Deploy Frontend → Production
  # ============================================================
  deploy-production:
    name: Build & Deploy Frontend → Production
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: 3. Install Dependencies (sesuai package-lock.json)
      run: npm ci

    - name: 4. Tes Otomatis (deploy dibatalkan bila ada yang gagal)
      run: npm test

    - name: 5. Build Vite (Production)
      run: npm run build

    - name: 6. Kompres Hasil Build dist
      run: tar -czf dist.tar.gz dist/

    - name: 7. Kirim dist.tar.gz ke Production VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        source: "dist.tar.gz"
        target: "/var/www/erp-fe/ERP-Sekar-Maju-Sejahtera"
        overwrite: true

    - name: 8. Ekstrak di Production VPS & Reload Nginx
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        command_timeout: 5m
        script: |
          set -e
          cd /var/www/erp-fe/ERP-Sekar-Maju-Sejahtera
          # Berkas lama sengaja tidak dihapus: tab yang masih membuka versi sebelumnya tetap bisa memuat potongan kodenya
          tar -xzf dist.tar.gz
          rm -f dist.tar.gz
          sudo systemctl reload nginx
          echo "=== DEPLOY FRONTEND PRODUCTION SUKSES ==="
